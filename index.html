<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sibona Giardini - Computer</title>
<style>
:root{
  --green:#15803d; --green-soft:#e8f5ec; --bg:#f4f6f4; --card:#ffffff; --text:#1c241e;
  --muted:#6b756d; --line:#dfe5e0; --red:#b91c1c; --orange:#c2410c; --blue:#1d4ed8;
  --input:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{ --green:#4ade80; --green-soft:#1d3a27; --bg:#171b18; --card:#222823; --text:#e8eee9;
    --muted:#9aa59c; --line:#364037; --red:#f87171; --orange:#fb923c; --blue:#7aa2ff; --input:#1b201c; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--text)}
input,select,textarea{background:var(--input);border:1px solid var(--line);border-radius:6px;padding:5px 7px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:-1px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--green)}
button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){ button.primary{color:#06240f} }
button.danger{color:var(--red)}
button:disabled{opacity:.45;cursor:default}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;display:flex;gap:12px;align-items:center;padding:10px 18px;flex-wrap:wrap}
@media (prefers-color-scheme: dark){ header{background:#14532d;color:#e8eee9} }
header h1{font-size:18px;margin:0;flex:1}
header .state{font-size:13px;opacity:.95}
header button{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);color:inherit}
header button.primary{background:#fff;color:#14532d;border-color:#fff}
nav{display:flex;gap:4px;padding:10px 18px 0;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--card)}
nav button{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted)}
nav button.on{color:var(--green);border-bottom-color:var(--green)}
main{padding:16px 18px 60px;max-width:1500px;margin:0 auto}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{position:sticky;top:0;background:var(--green-soft);text-align:left;font-size:12px;padding:7px 6px;white-space:nowrap}
td{padding:4px 5px;border-top:1px solid var(--line);vertical-align:middle}
td input,td select{width:100%}
td.num input{text-align:right}
tr.warn td{background:rgba(234,88,12,.09)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.s-Programmato{background:rgba(29,78,216,.14);color:var(--blue)}
.s-Da-incassare{background:rgba(234,88,12,.15);color:var(--orange)}
.s-Pagato{background:rgba(21,128,61,.15);color:var(--green)}
.muted{color:var(--muted)}
.right{text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%}
#login{max-width:380px;margin:12vh auto;padding:0 16px}
#login .card{display:flex;flex-direction:column;gap:10px}
#login h1{margin:0 0 4px;color:var(--green);font-size:22px}
.err{color:var(--red);font-size:13px;min-height:18px}
dialog{border:none;border-radius:14px;padding:0;max-width:min(860px,96vw);width:100%;background:var(--card);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog .in{padding:18px;max-height:88vh;overflow:auto}
dialog h2{margin:0 0 12px;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:12px;color:var(--muted);text-align:center;padding:4px}
.cal .day{min-height:84px;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--card);cursor:pointer;overflow:hidden}
.cal .day.sel{outline:2px solid var(--green)}
.cal .day.today .n{background:var(--green);color:#fff;border-radius:99px;padding:0 6px}
.cal .day.out{opacity:.4}
.cal .n{font-weight:700;font-size:12px;display:inline-block}
.cal .it{font-size:11px;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .more{font-size:11px;color:var(--muted)}
.tot{font-weight:700}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--green-soft);border-radius:99px;padding:2px 4px 2px 10px;margin:2px}
.pill button{border:none;background:none;padding:0 6px;color:var(--red);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:20px;font-weight:700}
.scroll{overflow:auto;max-height:calc(100vh - 260px)}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>Sibona Giardini</h1>
    <div class="muted">Versione per computer. Accedi con lo stesso account che usi nell'app.</div>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary" id="go">Accedi</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <h1>Sibona Giardini</h1>
    <span class="state" id="state"></span>
    <button id="reload">Ricarica dal cloud</button>
    <button class="primary" id="save" disabled>Salva sul cloud</button>
    <button id="logout">Esci</button>
  </header>
  <nav id="tabs"></nav>
  <main id="main"></main>
</div>

<dialog id="dlg"><div class="in" id="dlgBody"></div></dialog>

<script>
'use strict';
const API_KEY = 'AIzaSyCO42i00gxtWvEPdDsanTDdrK6gfcYTeK4';
const PROJECT = 'sibona-giardini';
const STATUSES = ['Programmato', 'Da incassare', 'Pagato'];
const BILLINGS = ['', 'Fattura', 'Contanti'];
const REPEATS = [['', 'Mai'], ['w1', 'Ogni settimana'], ['w2', 'Ogni 2 settimane'], ['w3', 'Ogni 3 settimane'], ['w4', 'Ogni 4 settimane'], ['m1', 'Ogni mese']];
const DEBT_KINDS = ['Fattura da pagare', 'Prestito', 'Finanziamento', 'Altro'];
const MONTHS = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const LIMIT = 85000;

// ---------- piccoli strumenti ----------
const $ = (s) => document.querySelector(s);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const pad = (n) => String(n).padStart(2, '0');
function pDMY(s) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(s || '').trim());
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]);
  return d.getMonth() === +m[2] - 1 ? d : null;
}
const fDMY = (d) => pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
function toISO(s) { const d = pDMY(s); return d ? d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) : ''; }
function fromISO(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const dayOnly = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  const n = parseFloat(String(v == null ? '' : v).trim().replace(',', '.'));
  return isFinite(n) ? n : 0;
}
const r2 = (n) => Math.round(n * 100) / 100;
const eur = (n) => num(n).toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
const newId = () => String(Date.now() * 1000 + Math.floor(Math.random() * 1000));
const lc = (s) => String(s || '').trim().toLowerCase();

// ---------- regole sui lavori (come nell'app) ----------
function paidSum(w) { return (w.payments || []).reduce((a, m) => a + num(m.amount), 0); }
function pays(w) {
  if (w.payments && w.payments.length) {
    return w.payments.map((m) => ({ date: pDMY(m.date) || pDMY(w.date), amount: num(m.amount), billing: m.billing || '' }));
  }
  if (w.status === 'Pagato') {
    return [{ date: pDMY(w.paidDate) || pDMY(w.date), amount: num(w.price), billing: w.billing || '' }];
  }
  return [];
}
function residual(w) {
  if (w.status === 'Pagato') return 0;
  const r = num(w.price) - paidSum(w);
  return r > 0.004 ? r : 0;
}
function coversDay(w, d) {
  const x = dayOnly(d), first = pDMY(w.date);
  if (!first) return false;
  if (sameDay(x, first)) return true;
  const end = pDMY(w.endDate);
  if (end && x >= first && x <= end) return true;
  return (w.extraDays || []).some((e) => { const ed = pDMY(e); return ed && sameDay(ed, x); });
}
function setStatus(w, st) {
  if (st === w.status) return;
  const res = num(w.price) - paidSum(w);
  if (st === 'Pagato') {
    w.paidDate = fDMY(new Date());
    if (w.payments && w.payments.length && res > 0.004) {
      w.payments.push({ date: w.paidDate, amount: r2(res), billing: w.billing || '' });
    }
  } else if (w.status === 'Pagato' && w.payments && w.payments.length) {
    w.payments.pop();
    w.paidDate = '';
  }
  w.status = st;
  fixWork(w);
}
function fixWork(w) {
  w.price = num(w.price);
  w.payments = w.payments || [];
  if (w.payments.length) {
    const sum = paidSum(w);
    if (w.status === 'Pagato' && sum < w.price - 0.004) {
      w.payments.push({ date: w.paidDate || w.date, amount: r2(w.price - sum), billing: w.billing || '' });
    } else if (w.status !== 'Pagato' && w.price > 0 && sum >= w.price - 0.004) {
      w.status = 'Pagato';
      w.paidDate = w.payments[w.payments.length - 1].date;
    }
  }
  if (w.status === 'Pagato') {
    if (!w.paidDate) w.paidDate = w.date;
    w.payMethod = w.billing === 'Fattura' ? 'Conto' : (w.billing === 'Contanti' ? 'Contanti' : '');
  } else {
    w.paidDate = '';
    w.payMethod = '';
  }
}
function blankWork(date) {
  return { id: newId(), client: '', desc: '', date: date || fDMY(new Date()), time: '09:00', status: 'Programmato', price: 0, notes: '',
    paidDate: '', billing: '', payMethod: '', repeat: '', followUp: false, lines: [], docs: [], toInvoice: false, payments: [],
    endDate: '', photos: [], extraDays: [] };
}
function normStatus(raw) {
  const s = String(raw || '').toLowerCase();
  if (s.startsWith('pagato')) return 'Pagato';
  if (s.startsWith('in attesa') || s.startsWith('da incassare')) return 'Da incassare';
  return 'Programmato';
}

// ---------- cloud ----------
const S = { session: null, data: null, stamp: '', dirty: false, tab: 'agenda', cal: dayOnly(new Date()), sel: dayOnly(new Date()),
  f: { q: '', st: '', sort: 'desc', year: String(new Date().getFullYear()) } };

function errMsg(code) {
  if (/EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS/.test(code)) return 'Email o password non corrette.';
  if (/TOO_MANY_ATTEMPTS/.test(code)) return 'Troppi tentativi: riprova tra qualche minuto.';
  if (/USER_DISABLED/.test(code)) return 'Questo account è stato disattivato.';
  if (/API key|referer|blocked/i.test(code)) return 'La chiave di accesso non permette questo sito. Scrivimi il messaggio e lo sistemo.';
  return code ? 'Errore: ' + code : 'Errore di accesso.';
}
async function signIn(email, password) {
  let r;
  try {
    r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + API_KEY, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, returnSecureToken: true }) });
  } catch (e) { throw new Error('Nessuna connessione.'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(errMsg(d.error && d.error.message || ''));
  S.session = { email, uid: d.localId, idToken: d.idToken, refresh: d.refreshToken, exp: Date.now() + (+d.expiresIn || 3600) * 1000 };
}
async function token() {
  const s = S.session;
  if (s.exp - Date.now() > 120000) return s.idToken;
  const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + API_KEY, {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(s.refresh) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('Sessione scaduta: accedi di nuovo.');
  s.idToken = d.id_token; s.refresh = d.refresh_token || s.refresh; s.exp = Date.now() + (+d.expires_in || 3600) * 1000;
  return s.idToken;
}
const docUrl = (q) => 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents/users/' + S.session.uid + '/data/backup' + (q || '');
async function fetchRemote() {
  const r = await fetch(docUrl(), { headers: { Authorization: 'Bearer ' + await token() } });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(r.status === 403 || r.status === 401 ? 'Permesso negato dal cloud.' : 'Errore del cloud (' + r.status + ').');
  const d = await r.json();
  const f = d.fields || {};
  const text = f.json && f.json.stringValue || '';
  if (!text) return null;
  return { text, stamp: f.updatedAt && f.updatedAt.stringValue || '' };
}
async function putRemote(text, stamp) {
  if (new TextEncoder().encode(text).length > 900000) throw new Error('Troppi dati per il cloud (limite circa 1 MB).');
  const r = await fetch(docUrl('?updateMask.fieldPaths=json&updateMask.fieldPaths=updatedAt'), {
    method: 'PATCH', headers: { Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields: { json: { stringValue: text }, updatedAt: { stringValue: stamp } } }) });
  if (!r.ok) throw new Error(r.status === 403 || r.status === 401 ? 'Permesso negato dal cloud.' : 'Errore del cloud (' + r.status + ').');
}
function adopt(remote) {
  const d = JSON.parse(remote.text);
  for (const k of ['works', 'clients', 'events', 'expenses', 'notes', 'catalog', 'debts', 'stops']) if (!Array.isArray(d[k])) d[k] = [];
  if (!Array.isArray(d.categories)) d.categories = ['Benzina', 'Semi', 'Terriccio', 'Piante', 'Attrezzi', 'Altro'];
  for (const w of d.works) {
    const b = blankWork(w.date);
    for (const k of Object.keys(b)) if (w[k] === undefined) w[k] = b[k];
    w.status = normStatus(w.status);
    w.price = num(w.price);
  }
  S.data = d; S.stamp = remote.stamp; S.dirty = false;
}
async function load() {
  const remote = await fetchRemote();
  if (!remote) throw new Error('Nel cloud non ci sono ancora dati: apri prima l\'app sul telefono.');
  adopt(remote);
}
async function save() {
  const btn = $('#save');
  btn.disabled = true; btn.textContent = 'Salvo…';
  try {
    const remote = await fetchRemote();
    if (remote && remote.stamp !== S.stamp) {
      if (!confirm('Qualcuno ha cambiato i dati (per esempio dal telefono) dopo che hai aperto questa pagina.\n\nOK = sovrascrivo con le mie modifiche\nAnnulla = non salvo (poi puoi ricaricare dal cloud)')) { return; }
    }
    S.data.works.forEach(fixWork);
    S.data.exported = new Date().toISOString();
    const stamp = new Date().toISOString();
    await putRemote(JSON.stringify(S.data), stamp);
    S.stamp = stamp; S.dirty = false;
    renderState(); render();
    toast('Salvato sul cloud. Il telefono lo scarica alla prossima sincronizzazione.');
  } catch (e) { alert(e.message || e); }
  finally { btn.textContent = 'Salva sul cloud'; renderState(); }
}
function touch() { S.dirty = true; renderState(); }
function renderState() {
  const st = $('#state');
  st.textContent = S.dirty ? 'Modifiche non ancora salvate' : (S.stamp ? 'Dati del ' + new Date(S.stamp).toLocaleString('it-IT') : '');
  $('#save').disabled = !S.dirty;
  document.title = (S.dirty ? '● ' : '') + 'Sibona Giardini - Computer';
}
let toastT;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = el('div', { id: 'toast', style: 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:13px' }); document.body.append(t); }
  t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 4500);
}
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

// ---------- campi riutilizzabili ----------
function dateField(get, set, onchange) {
  return el('input', { type: 'date', value: toISO(get()), onchange: (e) => { set(fromISO(e.target.value)); touch(); if (onchange) onchange(); } });
}
function textField(get, set, opts) {
  opts = opts || {};
  return el('input', { type: opts.type || 'text', value: get() == null ? '' : get(), list: opts.list, placeholder: opts.ph, inputmode: opts.mode,
    oninput: (e) => { set(e.target.value); touch(); }, onchange: opts.onchange });
}
function moneyField(get, set, onchange) {
  return el('input', { type: 'text', inputmode: 'decimal', value: num(get()) ? String(num(get())).replace('.', ',') : '',
    oninput: (e) => { set(num(e.target.value)); touch(); }, onchange: onchange });
}
function selectField(get, set, options, onchange) {
  const cur = get();
  return el('select', { onchange: (e) => { set(e.target.value); touch(); if (onchange) onchange(); } },
    options.map((o) => { const v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : (o || '—'); return el('option', { value: v, selected: v === cur }, l); }));
}
function clientList() {
  return el('datalist', { id: 'clientNames' }, S.data.clients.map((c) => el('option', { value: c.name })));
}
function ensureClient(name) {
  const n = String(name || '').trim();
  if (!n) return;
  if (!S.data.clients.some((c) => lc(c.name) === lc(n))) S.data.clients.push({ id: newId(), name: n, address: '', phone: '', email: '' });
}

// ---------- finestra di modifica ----------
function openDialog(title, build, onOk, okLabel) {
  const body = $('#dlgBody');
  body.replaceChildren();
  const content = build();
  const actions = el('div', { class: 'bar', style: 'margin:14px 0 0' },
    el('span', { class: 'sp' }),
    el('button', { onclick: () => $('#dlg').close() }, 'Annulla'),
    el('button', { class: 'primary', onclick: () => { if (onOk() !== false) $('#dlg').close(); } }, okLabel || 'Fatto'));
  body.append(el('h2', null, title), content, actions);
  $('#dlg').showModal();
}
const fld = (label, input) => el('div', { class: 'fld' }, el('label', null, label), input);

// ---------- scheda lavoro ----------
function editWork(orig, isNew) {
  const w = JSON.parse(JSON.stringify(orig));
  let box;
  const redraw = () => { const nb = build(); box.replaceWith(nb); box = nb; };
  function build() {
    const paysBox = el('div', null,
      (w.payments || []).map((m, i) => el('div', { class: 'grid3', style: 'margin-bottom:4px;align-items:center' },
        dateField(() => m.date, (v) => m.date = v),
        moneyField(() => m.amount, (v) => m.amount = v),
        el('div', { style: 'display:flex;gap:6px' }, selectField(() => m.billing || '', (v) => m.billing = v, BILLINGS),
          el('button', { class: 'danger', title: 'Togli', onclick: () => { w.payments.splice(i, 1); redraw(); } }, '✕')))),
      el('button', { onclick: () => { const rest = Math.max(0, num(w.price) - paidSum(w)); w.payments.push({ date: fDMY(new Date()), amount: r2(rest), billing: w.billing || '' }); redraw(); } }, '+ Registra pagamento'),
      (w.payments || []).length ? el('div', { class: 'muted', style: 'margin-top:4px' }, 'Incassato ' + eur(paidSum(w)) + ' di ' + eur(w.price)) : null);
    const extra = el('div', null,
      (w.extraDays || []).map((e, i) => el('span', { class: 'pill' }, e, el('button', { onclick: () => { w.extraDays.splice(i, 1); redraw(); } }, '✕'))),

const STOP_REASONS = ['Pioggia', 'Maltempo/vento', 'Malattia', 'Ferie', 'Altro'];
const STOP_ICON = { 'Pioggia': '☔', 'Maltempo/vento': '💨', 'Malattia': '🤒', 'Ferie': '🏖️', 'Altro': '⏸️' };
const stopIcon = (r) => STOP_ICON[r] || '⏸️';
function stopOn(day) { return S.data.stops.find((x) => { const d = pDMY(x.date); return d && sameDay(d, day); }); }
function editStop(orig, isNew) {
  const x = JSON.parse(JSON.stringify(orig));
  let to = '';
  const box = el('div', null,
    el('div', { class: 'grid2' },
      fld('Motivo', selectField(() => x.reason, (v) => x.reason = v, STOP_REASONS)),
      fld('Data', dateField(() => x.date, (v) => x.date = v))),
    isNew ? fld('Fino al (se più giorni di fila)', dateField(() => to, (v) => to = v)) : null,
    fld('Nota', textField(() => x.note, (v) => x.note = v)),
    isNew ? null : el('div', { style: 'margin-top:8px' }, el('button', { class: 'danger', onclick: () => {
      if (!confirm('Togliere questo giorno di stop?')) return;
      S.data.stops.splice(S.data.stops.findIndex((y) => y.id === orig.id), 1); touch(); render(); $('#dlg').close(); } }, 'Elimina giorno di stop')));
  openDialog(isNew ? 'Giorno di stop' : 'Modifica giorno di stop', () => box, () => {

    if (!a) { alert('Scrivi una data valida.'); return false; }
    if (!isNew) {
      const i = S.data.stops.findIndex((y) => y.id === orig.id);
      if (i >= 0) S.data.stops[i] = { id: orig.id, date: fDMY(a), reason: x.reason, note: x.note || '' };
      touch(); render(); return;
    }
    let b = pDMY(to); if (!b || b < a) b = a;
    let n = 0;
    for (let d = new Date(a); d <= b && n < 62; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1), n++) {
      const ex = stopOn(d);

      else S.data.stops.push({ id: newId(), date: fDMY(d), reason: x.reason, note: x.note || '' });
    }
    touch(); render();
  }, 'Salva');
}

// ---------- Debiti ----------
function debtResidual(x) { const p = (x.payments || []).reduce((a, m) => a + num(m.amount), 0); const r = num(x.total) - p; return r > 0.004 ? r : 0; }

      fld('Pagamenti fatti', el('div', null,
        x.payments.map((m, i) => el('div', { style: 'display:flex;gap:6px;margin-bottom:4px;align-items:center' }, dateField(() => m.date, (v) => m.date = v), moneyField(() => m.amount, (v) => m.amount = v),
          textField(() => m.note || '', (v) => m.note = v), el('button', { class: 'danger', onclick: () => { x.payments.splice(i, 1); redraw(); } }, '✕'))),
        el('button', { onclick: () => { x.payments.push({ date: fDMY(new Date()), amount: r2(debtResidual(x)), note: '' }); redraw(); } }, x.credit ? '+ Registra incasso' : '+ Registra pagamento'),
        el('div', { class: 'muted', style: 'margin-top:4px' }, (x.credit ? 'Da ricevere ' : 'Residuo ') + eur(debtResidual(x))))));
  }
  box = build();
  openDialog((x.credit ? 'Credito' : 'Debito') + (isNew ? ' (nuovo)' : ''), () => box, () => {
    if (!String(x.name || '').trim()) { alert('Scrivi un nome.'); return false; }

}
function viewDebts() {

      el('td', { style: 'white-space:nowrap' }, el('button', { onclick: () => editDebt(x) }, 'Modifica'), ' ',

    el('div', { class: 'bar' }, el('strong', null, 'Ancora da pagare: ' + eur(sum(debts))), el('span', { class: 'muted' }, '(separati dalle spese)'), el('span', { class: 'sp' }),
      el('button', { class: 'primary', onclick: () => editDebt({ id: newId(), name: '', kind: 'Altro', total: 0, due: '', note: '', payments: [] }, true) }, '+ Nuovo debito')),

// ---------- Listino, impegni, appunti ----------

// ---------- Riepilogo ----------
function viewSummary() {
  const d = S.data;
  const years = new Set([new Date().getFullYear()]);
  for (const w of d.works) for (const p of pays(w)) if (p.date) years.add(p.date.getFullYear());
  for (const e of d.expenses) { const x = pDMY(e.date); if (x) years.add(x.getFullYear()); }
  const ylist = [...years].sort((a, b) => b - a);
  const y = +S.f.sy || ylist[0];
  const inv = Array(12).fill(0), cash = Array(12).fill(0), oth = Array(12).fill(0), sp = Array(12).fill(0);
  for (const w of d.works) for (const p of pays(w)) {
    if (!p.date || p.date.getFullYear() !== y) continue;
    const m = p.date.getMonth();
    if (p.billing === 'Fattura') inv[m] += p.amount; else if (p.billing === 'Contanti') cash[m] += p.amount; else oth[m] += p.amount;
  }
  for (const e of d.expenses) { const x = pDMY(e.date); if (x && x.getFullYear() === y) sp[x.getMonth()] += num(e.amount); }
  const sum = (a) => a.reduce((s, v) => s + v, 0);
  const tInv = sum(inv), tCash = sum(cash), tOth = sum(oth), tSp = sum(sp);
  const owed = d.works.reduce((a, w) => a + (w.status === 'Da incassare' ? residual(w) : 0), 0);
  const kpi = (l, v, st) => el('div', { class: 'card kpi' }, el('div', { class: 'l' }, l), el('div', { class: 'v', style: st || '' }, eur(v)));
  return el('div', null,
    el('div', { class: 'bar' }, el('select', { onchange: (e) => { S.f.sy = e.target.value; render(); } }, ylist.map((v) => el('option', { value: String(v), selected: v === y }, v))),
      el('span', { class: 'muted' }, 'Ogni pagamento conta nel mese della sua data. Il forfettario conta solo i pagamenti con Fattura.')),
    el('div', { class: 'kpis' },
      kpi('Incassato con fattura', tInv), kpi('Incassato in contanti', tCash), tOth > 0 ? kpi('Tipo non indicato', tOth, 'color:var(--orange)') : null,
      kpi('Totale incassato', tInv + tCash + tOth), kpi('Spese', tSp), kpi('Utile', tInv + tCash + tOth - tSp),
      kpi('Da incassare (totale)', owed, 'color:var(--orange)'), kpi('Manca al limite forfettario', LIMIT - tInv)),
    (() => {
      const mine = d.stops.filter((x) => { const t = pDMY(x.date); return t && t.getFullYear() === y; });
      if (!mine.length) return null;
      const by = {}; for (const x of mine) by[x.reason] = (by[x.reason] || 0) + 1;
      return el('div', { class: 'card', style: 'margin:0 0 12px' }, el('strong', null, 'Giorni di stop ' + y + ': ' + mine.length),
        el('span', { class: 'muted' }, '  ' + Object.keys(by).map((k) => stopIcon(k) + ' ' + k + ' ' + by[k]).join(' · ')));
    })(),
    el('table', null,
      el('thead', null, el('tr', null, ['Mese', 'Fattura', 'Contanti', 'Non indicato', 'Incassato', 'Spese', 'Utile'].map((h) => el('th', { class: h === 'Mese' ? '' : 'right' }, h)))),
      el('tbody', null, MONTHS.map((m, i) => el('tr', null,
        el('td', null, m[0].toUpperCase() + m.slice(1)), el('td', { class: 'right' }, eur(inv[i])), el('td', { class: 'right' }, eur(cash[i])), el('td', { class: 'right' }, eur(oth[i])),
        el('td', { class: 'right' }, eur(inv[i] + cash[i] + oth[i])), el('td', { class: 'right' }, eur(sp[i])), el('td', { class: 'right' }, eur(inv[i] + cash[i] + oth[i] - sp[i])))),
        el('tr', { class: 'tot' }, el('td', null, 'Totale'), el('td', { class: 'right' }, eur(tInv)), el('td', { class: 'right' }, eur(tCash)), el('td', { class: 'right' }, eur(tOth)),
          el('td', { class: 'right' }, eur(tInv + tCash + tOth)), el('td', { class: 'right' }, eur(tSp)), el('td', { class: 'right' }, eur(tInv + tCash + tOth - tSp))))));
}

const TABS = [['agenda', 'Agenda', viewAgenda], ['lavori', 'Lavori', viewWorks], ['clienti', 'Clienti', viewClients], ['spese', 'Spese', viewExpenses],
  ['debiti', 'Debiti e crediti', viewDebts], ['riepilogo', 'Riepilogo', viewSummary], ['listino', 'Listino', viewCatalog], ['impegni', 'Impegni', viewEvents], ['appunti', 'Appunti', viewNotes]];

async function start() {
  try { await load(); } catch (e) { $('#loginErr').textContent = e.message; $('#login').hidden = false; $('#app').hidden = true; return false; }
  $('#login').hidden = true; $('#app').hidden = false;
  renderState(); render();
  return true;
}
$('#go').onclick = async () => {
  const email = $('#email').value.trim(), pass = $('#pass').value;
  $('#loginErr').textContent = '';
  if (!email || !pass) { $('#loginErr').textContent = 'Scrivi email e password.'; return; }
  $('#go').disabled = true; $('#go').textContent = 'Accedo…';
  try { await signIn(email, pass); try { localStorage.setItem('sg_email', email); } catch (e) {} await start(); }
  catch (e) { $('#loginErr').textContent = e.message; }
  finally { $('#go').disabled = false; $('#go').textContent = 'Accedi'; }
};
$('#pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#go').click(); });
$('#save').onclick = save;

  if (S.dirty && !confirm('Hai modifiche non salvate: se ricarichi si perdono. Ricarico?')) return;
  try { await load(); renderState(); render(); toast('Dati ricaricati dal cloud.'); } catch (e) { alert(e.message); }
};

try { $('#email').value = localStorage.getItem('sg_email') || ''; } catch (e) {}
